<!DOCTYPE html>
<html>
<head>
    <title>SaaS Login Page</title>
    <link rel="stylesheet" type="text/css" href="{{ url_for('static', filename='css/saas-login.css') }}">
</head>
<body>
  <div class="login-container">
    

    <h2 class="login-text">Login Here</h2>
    <div class="form-box">
      <form method="POST">
        <div class="form-group">
          <label for="username">Username</label>
          <input type="text" id="username" name="username" required>
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" name="password" required>
        </div>

        <input type="submit" value="Login">
      </form>
    </div>

    <p class="register-text">Don't have an account? <a href="/register">Register here</a></p>

    {% with messages = get_flashed_messages() %}
    {% if messages %}
      <script>
        alert("{{ messages[0] }}");
      </script>
    {% endif %}
    {% endwith %}

  </div>
</body>
</html>
