<!DOCTYPE html>
<html>
<head>
    <title>SaaS Registration Page</title>
    <link rel="stylesheet" type="text/css" href="{{ url_for('static', filename='css/saas-register.css') }}">
</head>
<body>
  <div class="register-container">
    
    <!-- Header -->
    <h2 class="register-text">Register Here</h2>

    <!-- Registration Form -->
    <div class="form-box">
      <form method="POST">
        <div class="form-group">
          <label for="username">Username</label>
          <input type="text" id="username" name="username" required>
        </div>

        <div class="form-group">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" required>
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" name="password" required>
        </div>

        <input type="submit" value="Register">
      </form>
    </div>

    <!-- Login Redirect -->
    <p class="login-text">Already have an account? <a href="/login">Login here</a></p>

    {% with messages = get_flashed_messages() %}
    {% if messages %}
      <script>
        alert("{{ messages[0] }}");
      </script>
    {% endif %}
    {% endwith %}
    
  </div>
</body>
</html>
